[package]
name = "load-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
indicatif = "0.17" # For progress bars
headers = "0.3"
futures = "0.3"
