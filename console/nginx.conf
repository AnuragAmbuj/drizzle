server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Rewrite /api/foo -> /foo
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://drizzle-admin:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /observability/ {
        # Rewrite /observability/foo -> /foo (except /observability/logs/live might need specific handling if gateway expects path)
        # Gateway expects /observability/logs... so NO rewrite?
        # My gateway code checks contain("GET /observability/logs")
        # So I should pass path as is?
        # Vite config: rewrite: (path) => path.replace(/^\/observability\/metrics/, '/metrics') (for metrics)
        # But /observability/logs/live -> /observability/logs/live?
        # My gateway code handles /observability/logs/live.
        # So pass as is.
        proxy_pass http://drizzle-gateway:9111;
        proxy_set_header Host $host;
        
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }
}
