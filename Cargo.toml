[workspace]
resolver = "2"
members = [
    "control-plane/crates/contracts",
    "control-plane/crates/domain",
    "control-plane/crates/events",
    "control-plane/crates/storage",
    "control-plane/services/admin-api",
    "control-plane/services/auditor",
    "control-plane/services/distributor",
    "control-plane/services/idp",
    "control-plane/services/secrets",
    "control-plane/bin/admin-cli",
    "gateway/bin/gatewayd",
    "gateway/crates/authn",
    "gateway/crates/authz",
    "gateway/crates/commons",
    "gateway/crates/core",
    "gateway/crates/proxy",
    "gateway/crates/limits",
    "gateway/crates/routing",
    "gateway/crates/transforms",
    "gateway/crates/observability",
    "gateway/crates/snapshot",
    "gateway/crates/plugin-sdk",
    "gateway/crates/plugin-host",
    "gateway/crates/tls",
    "gateway/crates/errors", "tooling/load-gen",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
authors = ["Anurag Ambuj <anurag.ambuj@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2.0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
pingora = { version = "0.6", features = ["lb"] }
# wasmtime = "26"
# opentelemetry = "0.25"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.18", features = ["derive"] }
regex = "1.10"
lazy_static = "1.4"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
arc-swap = "1.7"
axum = "0.7"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "sqlite", "macros", "uuid", "chrono", "migrate", "json"] }
dotenvy = "0.15"
